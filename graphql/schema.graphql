"A datetime string with format `Y-m-d H:i:s`, e.g. `2018-05-23 13:43:32`."
scalar DateTime
    @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

scalar Upload
    @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\Upload")

"Indicates what fields are available at the top level of a query operation."
type Query {
    "Find a single user by an identifying attribute."
    user(
        "Search by primary key."
        id: ID @eq @rules(apply: ["prohibits:email", "required_without:email"])

        "Search by email address."
        email: String
            @eq
            @rules(apply: ["prohibits:id", "required_without:id", "email"])
    ): User @find

    "List multiple users."
    users(
        "Filters by name. Accepts SQL LIKE wildcards `%` and `_`."
        name: String @where(operator: "like")
    ): [User!]! @paginate(defaultCount: 10)
}

"Account of a person who uses this application."
type User {
    "Unique primary key."
    id: ID!

    "Non-unique name."
    name: String!

    "Unique email address."
    email: String!

    "When the email was verified."
    email_verified_at: DateTime

    "When the account was created."
    created_at: DateTime!

    "When the account was last updated."
    updated_at: DateTime!

    roles: [String!]!
}

type Studio {
    id: ID!
    name: String!
    code: String!
    description: String
    capacity: Int
    size_sqm: Float
    slug: String!
    thumbnail: String
    thumbnail_url: String
    sort_order: Int!
    is_active: Boolean!
    photos: [StudioPhoto!]! @hasMany
    pricing_tiers: [PricingTier!]! @hasMany(relation: "pricingTiers")
    addons: [Addon!]! @belongsToMany
    cretime: DateTime
    modtime: DateTime
}

type StudioPhoto {
    id: ID!
    path: String!
    url: String!
    sort_order: Int!
}

type Bundle {
    id: ID!
    code: String!
    name: String!
    slug: String!
    description: String
    thumbnail: String
    studio: Studio! @belongsTo
    pricing_tier: PricingTier! @belongsTo(relation: "pricingTier")
    addons: [BundleAddon!]! @hasMany(relation: "bundleAddons")
    bundle_price: Int!
    normal_price: Int!
    discount_amount: Int!
    valid_from: DateTime
    valid_until: DateTime
    quota_limit: Int
    quota_period: String
    quota_remaining: Int
    is_active: Boolean!
    is_sellable: Boolean!
    sort_order: Int!
}

type BundleAddon {
    id: ID!
    addon: Addon! @belongsTo
    duration_minutes: Int
    normal_price: Int!
}

input BundleAddonInput {
    addon_id: ID!
    duration_minutes: Int
}

input BundleInput {
    name: String!
    description: String
    studio_id: ID!
    pricing_tier_id: ID!
    bundle_price: Int!
    valid_from: String
    valid_until: String
    quota_limit: Int
    quota_period: String
    sort_order: Int
    is_active: Boolean
    addons: [BundleAddonInput!]!
}

type PricingTier {
    id: ID!
    studio: Studio! @belongsTo
    duration_minutes: Int!
    price: Int!
    is_active: Boolean!
}

type Addon {
    id: ID!
    name: String!
    icon: String
    pricing_type: String!
    flat_price: Int
    is_active: Boolean!
    studios: [Studio!]! @belongsToMany
    prices: [AddonPrice!]! @hasMany
    resources: [Resource!]! @hasMany
}

type AddonPrice {
    id: ID!
    addon: Addon! @belongsTo
    duration_minutes: Int!
    price: Int!
    is_active: Boolean!
}

type Resource {
    id: ID!
    addon: Addon! @belongsTo
    name: String!
    code: String!
    sort_order: Int!
    is_active: Boolean!
    cretime: DateTime
    modtime: DateTime
}

type Booking {
    id: ID!
    code: String!
    customer_name: String!
    customer_wa: String!
    start_time: DateTime!
    end_time: DateTime!
    duration_minutes: Int!
    status: String!
    payment_method: String
    payment_status: String!
    payment_url: String
    studio_price_at_booking: Int!
    addon_total: Int!
    grand_total: Int!
    bundle: Bundle @belongsTo(relation: "bundle")
    bundle_name_at_booking: String
    bundle_price_at_booking: Int
    discount_total: Int!
    payment_expires_at: DateTime
    studio: Studio! @belongsTo(relation: "studio")
    pricing_tier: PricingTier @belongsTo(relation: "pricingTier")
    addons: [BookingAddon!]! @hasMany(relation: "addons")
}

type BookingAddon {
    id: ID!
    duration_minutes: Int
    price_at_booking: Int!
    is_bundle_item: Boolean!
    addon: Addon! @belongsTo
    resource: Resource @belongsTo
}

type BookingSlot {
    start_time: DateTime!
    end_time: DateTime!
    available: Boolean!
    reason: String
}

type AddonAvailability {
    addon_id: ID!
    available: Boolean!
    resource_name: String
    available_resource_count: Int!
    next_available_at: DateTime
    reason: String
}

input BookingAddonInput {
    addon_id: ID!
    duration_minutes: Int
}

extend type Query {
    studios: [Studio!]! @all @guard @can(ability: "manage-master-data")
    studio(id: ID! @eq): Studio @find @guard @can(ability: "manage-master-data")

    addons: [Addon!]! @all @guard @can(ability: "manage-master-data")
    resources: [Resource!]! @all @guard @can(ability: "manage-master-data")

    bookingAvailability(
        studio_id: ID!
        date: String!
        duration_minutes: Int!
    ): [BookingSlot!]!
        @field(resolver: "App\\GraphQL\\Queries\\BookingAvailability")
        @guard

    addonAvailability(
        studio_id: ID!
        addon_id: ID!
        start_time: String!
        duration_minutes: Int!
    ): AddonAvailability
        @field(resolver: "App\\GraphQL\\Queries\\AddonAvailability")
        @guard

    bookingAddonAvailability(
        studio_id: ID!
        start_time: String!
        duration_minutes: Int!
    ): [AddonAvailability!]!
        @field(resolver: "App\\GraphQL\\Queries\\BookingAddonAvailability")
        @guard

    bookings: [Booking!]!
        @all(model: "App\\Modules\\Booking\\Models\\Booking")
        @guard

    bundles: [Bundle!]!
        @field(resolver: "App\\GraphQL\\Mutations\\BundleMutations@all")
        @guard
        @can(ability: "manage-master-data")

    sellableBundles: [Bundle!]!
        @field(resolver: "App\\GraphQL\\Queries\\SellableBundles")
        @guard

    bundleAvailability(
        bundle_id: ID!
        date: String!
        exclude_booking_id: ID
    ): [BookingSlot!]!
        @field(resolver: "App\\GraphQL\\Queries\\BundleAvailability")
        @guard
}

